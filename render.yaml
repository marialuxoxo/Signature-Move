# Bauplan für Render (https://render.com): der kleine Server für den KI-Check.
# Die Oberfläche selbst liegt weiter auf GitHub Pages und spricht diesen Server an.
services:
  - type: web
    name: markenwerk-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://marialuxoxo.github.io
      - key: TRUST_PROXY
        value: "1"
      - key: DAILY_LIMIT
        value: "100"
